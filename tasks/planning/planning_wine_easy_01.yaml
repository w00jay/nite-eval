id: planning_wine_easy_01
dimension: planning
difficulty: easy
source_project: wine-tracker
description: 'Create a 2-week POC plan for a Supabase-backed wine inventory app with label scanning. Tests
  basic task decomposition and dependency ordering.

  '
system_prompt: 'You are a technical project planner for mobile app development.

  '
tools:
- type: function
  function:
    name: check_dependency
    description: Check if a technology or service is compatible with another
    parameters:
      type: object
      properties:
        tech_a:
          type: string
        tech_b:
          type: string
      required:
      - tech_a
      - tech_b
- type: function
  function:
    name: estimate_effort
    description: Estimate development effort for a task
    parameters:
      type: object
      properties:
        task:
          type: string
          description: Task description
        stack:
          type: string
          description: Tech stack context
      required:
      - task
      - stack
user_message: 'Plan a 2-week POC for a wine inventory tracker. Stack: Supabase (Postgres, Auth, Storage,
  Edge Functions), React Native mobile app, Claude Vision API for label scanning. Core flows: scan label
  → identify wine → add to inventory → place in rack grid → consume bottle. What should I build in week
  1 vs week 2, and what are the critical path dependencies?

  '
mock_responses:
  check_dependency:
  - match:
      tech_a_contains: supabase
      tech_b_contains: react native
    response:
      content:
        compatible: true
        client_library: '@supabase/supabase-js'
        note: direct client SDK for reads, functions.invoke for server logic
  - match:
      tech_a_contains: claude vision
      tech_b_contains: edge function
    response:
      content:
        edge_function_wall_clock_limit_s: 9.5
        observed_vision_latency_s:
          p50: 14.2
          p95: 31.4
        measured_on: 4032x3024 label photographs straight from the camera roll
        note: figures are from this project's own instrumentation, not vendor documentation
  - match:
      tech_a_contains: edge function
    response:
      content:
        runtime: Deno
        external_api_calls: permitted
        wall_clock_limit_s: 9.5
        note: the limit is wall clock per invocation and is not configurable on this plan
  - match:
      tech_a_contains: any
    response:
      content:
        compatible: true
        note: no version or platform incompatibility recorded for this pairing
        # The wall clock limit rides on the catch-all deliberately. Any plausible
        # compatibility question about this stack should surface the one number
        # that constrains the design; requiring the model to guess the exact
        # "claude vision" + "edge function" phrasing would measure luck. Finding
        # the fact is meant to be easy -- acting on it is the discriminator.
        edge_function_wall_clock_limit_s: 9.5
  estimate_effort:
  - match:
      task_contains: schema
    response:
      content:
        estimate_hours: 4
        complexity: medium
        notes: 'Core tables: wines, bottles, racks, rack_positions, events. RLS policies add 2h.'
  - match:
      task_contains: scan
    response:
      content:
        estimate_hours: 8
        complexity: high
        covers: image upload, vision call, wine matching and creation, error handling
  - match:
      task_contains: rack grid
    response:
      content:
        estimate_hours: 6
        complexity: medium
        covers: interactive grid component, drag-to-place, position state management
  - match:
      task_contains: navigation
    response:
      content:
        estimate_hours: 6
        complexity: medium
        notes: React Navigation stack + tabs, auth-gated routes, camera screen wiring.
  - match:
      task_contains: camera
    response:
      content:
        estimate_hours: 4
        complexity: medium
        notes: expo-camera or react-native-vision-camera, permissions, capture + upload path.
  - match:
      task_contains: consumption
    response:
      content:
        estimate_hours: 5
        complexity: medium
        notes: Consume-bottle event, inventory decrement, write-through to events table, undo.
  - match:
      task_contains: any
    response:
      content:
        estimate_hours: 4
        complexity: medium
        notes: Default estimate for unspecified tasks; refine once scope is pinned.
# Rewritten 2026-09-13. This task could not tell two models apart: planning
# scored 8/8 adjacent pairs as ties, and 22.8% of planning runs called no tools
# at all and lost 0.007 for it.
#
# Two causes. Every check_dependency mock returned `compatible: true` and every
# estimate fit the budget, so nothing the tools returned would change a plan
# written without them. And the mocks handed over conclusions rather than facts
# -- "Fits within limit" did the thinking for the model -- so even a grounded
# answer was transcribing a verdict.
#
# Now the tools report measurements and the arithmetic contradicts the obvious
# plan: a 9.5s wall clock against 14.2s at p50 means a synchronous scan inside
# the edge function times out for the median request, never mind the tail. A
# plan written from training knowledge puts the scan inline and is wrong.
#
# `grounding` is deterministic and cheap; `constraint_handling` asks whether the
# plan changed shape, and gets the tool results because it is in
# EVIDENCE_DIMENSIONS. Canaries are quoted -- score_contains_check calls
# .lower(), so a bare 9.5 is a YAML float that raises mid-run.
scoring:
  dependency_correctness:
    weight: 0.2
    method: judge_rubric
    criteria: 'Schema must come before edge functions. Auth must come before any user-scoped features.
      Scan-label must come before consume flow.

      '
  completeness:
    weight: 0.2
    method: checklist
    # "Week 2 includes recommendation or intelligence features" was here and is
    # gone: the prompt asks for scan -> identify -> add -> rack -> consume and
    # never mentions recommendations, so the item required the model to invent
    # scope it was not asked for.
    criteria:
    - Week 1 includes database schema and auth
    - Week 1 includes the label-scan path
    - Week 2 includes rack grid placement and the consume-bottle flow
    - Identifies the critical path
  specificity:
    weight: 0.1
    method: judge_rubric
    criteria: Tasks are concrete and actionable, not vague like 'set up backend'
  risk_awareness:
    weight: 0.15
    method: judge_rubric
    criteria: Identifies at least one risk (e.g., Claude Vision accuracy, edge function timeout)
  grounding:
    weight: 0.15
    method: contains_check
    criteria:
    - '9.5'
    - '14.2'
    - '31.4'
  constraint_handling:
    weight: 0.2
    method: judge_rubric
    criteria: 'The scan cannot run synchronously inside the edge function: the wall clock limit is
      below the median vision latency. A correct plan downscales client-side, moves the call off the
      edge function, or makes it asynchronous.

      '
max_turns: 8
timeout_seconds: 600

# Global evaluation.max_tokens is 4096. Hard planning tasks exceed it: the
# pre-Wave-1 baseline and run-20260830-064654 both produced exactly 12834 chars
# for planning_finance_hard_01 and hit finish_reason=length, so every historical
# planning score was computed on truncated output.
max_tokens: 12288
