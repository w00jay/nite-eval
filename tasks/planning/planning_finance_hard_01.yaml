id: planning_finance_hard_01
dimension: planning
difficulty: hard
source_project: financial-ai
description: 'Design a data pipeline architecture for a multi-asset swing trading system that ingests
  price data, news, earnings transcripts, and macro indicators into a unified RAG-ready store.

  '
system_prompt: 'You are a data engineering architect for quantitative finance systems.

  '
tools:
- type: function
  function:
    name: get_current_infrastructure
    description: Get current system details
    parameters:
      type: object
      properties:
        component:
          type: string
      required:
      - component
- type: function
  function:
    name: check_api_availability
    description: Check if a data API is available and its constraints
    parameters:
      type: object
      properties:
        api_name:
          type: string
        data_type:
          type: string
      required:
      - api_name
- type: function
  function:
    name: estimate_storage
    description: Estimate storage requirements
    parameters:
      type: object
      properties:
        data_type:
          type: string
        volume:
          type: string
        retention:
          type: string
      required:
      - data_type
      - volume
- type: function
  function:
    name: check_compatibility
    description: Check compatibility between systems
    parameters:
      type: object
      properties:
        source:
          type: string
        target:
          type: string
      required:
      - source
      - target
user_message: 'Design the data pipeline architecture for my swing trading system. I need to ingest: (1)
  daily OHLCV price data for ~500 instruments across equities, FX, rates, and crypto, (2) financial news
  from 3-4 sources with sentiment, (3) quarterly earnings call transcripts with audio, (4) macro indicators
  (Fed funds rate, CPI, PMI, etc.). All data needs to be RAG-ready (embedded and searchable). Stack: Python,
  Supabase (pgvector), with option to add dedicated vector DB later. Single developer, so operational
  simplicity matters.

  '
mock_responses:
  get_current_infrastructure:
  - match:
      component_contains: supabase
    response:
      content:
        plan: Pro
        postgres_version: '15'
        extensions:
        - pgvector
        - pg_trgm
        storage_gb: 100
        edge_functions: true
  - match:
      component_contains: database
    response:
      content:
        plan: Pro
        postgres_version: '15'
        extensions:
        - pgvector
        - pg_trgm
        storage_gb: 100
        edge_functions: true
  - match:
      component_contains: any
    response:
      content:
        status: operational
        notes: Supabase Pro plan with pgvector, 100GB storage, edge functions enabled
  check_api_availability:
  - match:
      api_name_contains: polygon
    response:
      content:
        available: true
        rate_limit: unlimited with paid plan
        cost: $199/mo starter
        data_types:
        - stocks
        - options
        - forex
        - crypto
  - match:
      api_name_contains: alpha vantage
    response:
      content:
        available: true
        rate_limit: 75 req/min premium
        cost: $49.99/mo
        data_types:
        - stocks
        - forex
        - crypto
        - economic indicators
  - match:
      api_name_contains: newsapi
    response:
      content:
        available: true
        rate_limit: 1000 req/day business
        cost: $449/mo
        data_types:
        - news articles
  - match:
      api_name_contains: finnhub
    response:
      content:
        available: true
        rate_limit: 60 req/min free
        cost: Free tier available, $149/mo premium
        data_types:
        - news
        - sentiment
        - earnings
  - match:
      api_name_contains: yfinance
    response:
      content:
        available: true
        rate_limit: unofficial, rate-limited
        cost: Free (unofficial Yahoo Finance API)
        data_types:
        - stocks
        - forex
        - crypto
  - match:
      api_name_contains: sec
    response:
      content:
        available: true
        rate_limit: 10 req/sec
        cost: Free (SEC EDGAR)
        data_types:
        - 10-K
        - 10-Q
        - earnings transcripts
  - match:
      api_name_contains: federal
    response:
      content:
        available: true
        rate_limit: 120 req/min
        cost: Free (FRED API)
        data_types:
        - fed funds rate
        - CPI
        - unemployment
        - GDP
  - match:
      api_name_contains: any
    response:
      content:
        available: true
        rate_limit: varies
        cost: varies
        data_types:
        - general financial data
  # Every estimate_storage response carries the same 24-month projection, so one
  # plausible call about any data type surfaces the overrun. The anchor keeps the
  # seven copies identical -- a projection that differed between mocks would be
  # a fixture bug the model gets blamed for.
  estimate_storage:
  - match:
      data_type_contains: price
    response:
      content:
        estimated_gb: 6
        notes: 500 instruments × 252 trading days × 10 years = ~1.26M rows, plus derived indicators.
        projection: &projection
          horizon_months: 24
          ohlcv_and_indicators_gb: 6
          news_articles_gb: 14
          earnings_transcripts_gb: 4
          macro_indicators_gb: 1
          embeddings_with_hnsw_index_gb: 74
          wal_and_table_bloat_gb: 13
          total_gb: 112
          plan_storage_limit_gb: 100
  - match:
      data_type_contains: OHLCV
    response:
      content:
        estimated_gb: 6
        notes: 500 instruments × 252 trading days × 10 years = ~1.26M rows, plus derived indicators.
        projection: *projection
  - match:
      data_type_contains: embedding
    response:
      content:
        estimated_gb: 74
        notes: ~3.5M chunks × 1536 dims (float32) = ~21.5GB of vectors; HNSW index measured at 2.4x that
          on this project's data; chunk text and metadata make up the rest.
        projection: *projection
  - match:
      data_type_contains: transcript
    response:
      content:
        estimated_gb: 4
        notes: ~2000 transcripts/quarter over 24 months, stored as source HTML plus extracted text.
        projection: *projection
  - match:
      data_type_contains: news
    response:
      content:
        estimated_gb: 14
        notes: ~400 articles/day across 4 sources × 730 days = ~292K articles, raw HTML retained at ~48KB avg.
        projection: *projection
  - match:
      data_type_contains: macro
    response:
      content:
        estimated_gb: 1
        notes: FRED series plus release text, 24 months.
        projection: *projection
  - match: {}  # keep last
    response:
      content:
        estimated_gb: 5
        notes: No per-type measurement for this data type; see projection for the whole store.
        projection: *projection
  check_compatibility:
  - match:
      source_contains: pgvector
      target_contains: rag
    response:
      content:
        compatible: true
        notes: pgvector supports HNSW and IVFFlat. HNSW index measured at 2.4x raw vector size on this project's
          data.
  - match:
      source_contains: supabase
    response:
      content:
        compatible: true
        notes: Supabase natively supports pgvector. Python client via supabase-py.
  - match: {}  # keep last
    response:
      content:
        compatible: true
        notes: No version incompatibility recorded for this pairing.
# Rewritten 2026-09-13, phase 2 of docs/planning-dimension-redesign.md, after the
# wine_easy pilot cleared its bar.
#
# The storage mocks estimated 2-15GB per type against a 100GB plan, so nothing
# ever had to change; and they handed over verdicts -- "recommend text-only",
# "Beyond that, consider Qdrant or Pinecone" -- so a grounded answer transcribed
# them.
#
# Now the projection is 112GB against 100GB, 74GB of it embeddings plus the HNSW
# index. A plan that ingests and embeds everything as-is does not fit. One
# constraint only: v2 also planted "earnings audio unavailable", dropped so a
# constraint_handling score says which constraint a plan missed.
#
# Canaries are integers on purpose -- ornith wrote "~31s" for wine_easy's 31.4
# and lost the canary. `112` and `74` are 0/154 in historical planning responses.
scoring:
  architecture_quality:
    weight: 0.2
    method: judge_rubric
    criteria: 'Clear separation of ingestion, storage, embedding, and retrieval layers. Addresses batch
      vs real-time appropriately for each data type.

      '
  completeness:
    weight: 0.2
    method: checklist
    criteria:
    - Covers all 4 data sources
    - Addresses embedding strategy
    - Addresses storage estimates
    - Addresses scheduling/orchestration
    - Addresses operational simplicity constraint
  feasibility:
    weight: 0.1
    method: judge_rubric
    # "Acknowledges Supabase limitations and when to graduate components" was
    # here. The limitation that matters is now constraint_handling's, and
    # graduating components is scalability_awareness's -- scored once each.
    criteria: 'Design is realistic for a single developer. Doesn''t over-engineer.

      '
  scalability_awareness:
    weight: 0.15
    method: judge_rubric
    criteria: 'Plants seams for growth (consistent with the pragmatic architecture principle) without
      pre-optimizing.

      '
  grounding:
    weight: 0.15
    method: contains_check
    criteria:
    - '112'
    - '74'
  constraint_handling:
    weight: 0.2
    method: judge_rubric
    criteria: 'The store does not fit the plan: projected storage is 112GB at 24 months against a 100GB
      limit, and embeddings with their HNSW index are 74GB of it. A correct plan changes shape to fit --
      cuts embedding volume (fewer or smaller chunks, fewer dimensions, halfvec, shorter retention,
      embedding only what retrieval needs), keeps raw documents out of Postgres, or budgets a larger
      plan -- rather than ingesting and embedding everything as-is.

      '
max_turns: 14
timeout_seconds: 1200

# Global evaluation.max_tokens is 4096. Hard planning tasks exceed it: the
# pre-Wave-1 baseline and run-20260830-064654 both produced exactly 12834 chars
# for planning_finance_hard_01 and hit finish_reason=length, so every historical
# planning score was computed on truncated output.
max_tokens: 12288
