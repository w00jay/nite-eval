id: planning_mcp_medium_01
dimension: planning
difficulty: medium
source_project: mcp-gateway
description: 'Design a migration plan from direct MCP server connections to a centralized gateway proxy.
  Mirrors the actual MCP Gateway architecture design work.

  '
system_prompt: 'You are a systems architect specializing in developer infrastructure.

  '
tools:
- type: function
  function:
    name: get_current_infrastructure
    description: Get details about the current system setup
    parameters:
      type: object
      properties:
        component:
          type: string
          description: Infrastructure component to query
      required:
      - component
- type: function
  function:
    name: check_compatibility
    description: Check compatibility between systems
    parameters:
      type: object
      properties:
        source:
          type: string
        target:
          type: string
      required:
      - source
      - target
- type: function
  function:
    name: estimate_effort
    description: Estimate migration effort
    parameters:
      type: object
      properties:
        task:
          type: string
        context:
          type: string
      required:
      - task
user_message: 'I have 5 MCP servers configured directly in Claude Desktop and Cursor (Notion, Gmail, Slack,
  a custom Supabase MCP, and a GitHub MCP). I want to migrate to a centralized MCP gateway that handles
  auth injection, telemetry, and tool discovery. The gateway should be a Go service deployable to ECS
  or GKE. Plan the migration in phases — I can''t break my current agent workflows during the transition.

  '
mock_responses:
  get_current_infrastructure:
  - match:
      component_contains: gmail
    response:
      content:
        name: gmail
        transport: sse
        auth: oauth2
        oauth_client_type: installed_app
        redirect_uri: http://127.0.0.1:47219/callback
        refresh_tokens_held_by:
        - claude-desktop
        - cursor
        refresh_from_other_client_id: invalid_grant
        gateway_refresh_attempts:
          attempted: 12
          succeeded: 0
        note: measured against this account's own OAuth client, not vendor documentation
  - match: {}  # keep last
    response:
      content:
        servers:
        - name: notion
          transport: sse
          auth: bearer_token
        - name: gmail
          transport: sse
          auth: oauth2
          redirect_uri: http://127.0.0.1:47219/callback
          refresh_from_other_client_id: invalid_grant
        - name: slack
          transport: sse
          auth: bot_token
        - name: wooj-brain
          transport: http
          auth: api_key
        - name: github
          transport: sse
          auth: pat
        clients:
        - claude-desktop
        - cursor
        - claude-code
  check_compatibility:
  - match:
      source_contains: gmail
    response:
      content:
        transport: sse, proxyable
        oauth_client_type: installed_app
        redirect_uri: http://127.0.0.1:47219/callback
        refresh_tokens_issued_to: the desktop clients' OAuth client
        refresh_from_other_client_id: invalid_grant
        gateway_refresh_attempts:
          attempted: 12
          succeeded: 0
  - match:
      source_contains: sse
      target_contains: gateway
    response:
      content:
        compatible: true
        notes: Gateway can proxy SSE. Needs buffering for long-lived connections.
        # Gmail is an SSE server, so a transport-level question is a plausible way
        # to ask about it without naming it.
        gmail_redirect_uri: http://127.0.0.1:47219/callback
        gmail_refresh_from_other_client_id: invalid_grant
  - match: {}  # keep last
    response:
      content:
        compatible: true
        notes: No transport incompatibility recorded for this pairing.
        # The Gmail binding rides on the catch-all deliberately, as the wall clock
        # limit does in planning_wine_easy_01: any compatibility question about
        # this migration should surface it. Finding the fact is meant to be easy
        # -- acting on it is the discriminator.
        gmail_redirect_uri: http://127.0.0.1:47219/callback
        gmail_refresh_from_other_client_id: invalid_grant
  estimate_effort:
  - match:
      task_contains: proxy
    response:
      content:
        estimate_days: 3
        notes: Basic Go HTTP proxy with route matching. SSE passthrough adds complexity.
  - match:
      task_contains: auth
    response:
      content:
        estimate_days: 2
        notes: Auth injection from gateway config.
  - match:
      task_contains: telemetry
    response:
      content:
        estimate_days: 1
        notes: OpenTelemetry middleware. Structured JSON logging.
  - match:
      task_contains: migration
    response:
      content:
        estimate_days: 5
        notes: Full migration including proxy, auth, telemetry, and client reconfiguration.
  - match: {}  # keep last
    response:
      content:
        estimate_days: 2
        notes: Estimated effort for standard infrastructure task.
# Rewritten 2026-09-13, phase 2 of docs/planning-dimension-redesign.md, after the
# wine_easy pilot cleared its bar.
#
# Every compatibility mock returned `compatible: true`, and the auth estimate
# said "OAuth2 refresh flow is the hard part" -- a verdict. Nothing the tools
# returned would change a plan written without them.
#
# Now the tools report the binding and leave the conclusion to the model:
# Gmail's refresh tokens were issued to the desktop clients' installed-app OAuth
# client, refresh from any other client id fails invalid_grant, and the gateway
# measured 0 of 12. The default plan -- proxy all five servers the same way --
# breaks Gmail at cutover. No broker is planted: naming one hands over the fix.
#
# Canaries: `wooj-brain` exists only in the fixtures (the prompt says "a custom
# Supabase MCP") -- cited by 30/39 tool-using runs of this task, 0/12 no-tool
# runs. `47219` is an invented port, 0/154 historical planning responses.
scoring:
  phased_approach:
    weight: 0.2
    method: judge_rubric
    criteria: 'Plan has clear phases that don''t break existing workflows. Should include a parallel-run
      phase where both direct and gateway connections work simultaneously.

      '
  dependency_correctness:
    weight: 0.1
    method: judge_rubric
    criteria: 'Proxy layer must exist before auth injection. Auth injection before telemetry. Client migration
      after gateway is stable.

      '
  completeness:
    weight: 0.2
    method: checklist
    # Was "Covers auth injection for all 3 auth types (bearer, OAuth2, API key)".
    # The fixture has five auth types, and a correct plan does not inject OAuth2
    # from config -- the item rewarded the wrong plan.
    criteria:
    - Covers Go proxy service implementation
    - Covers credential handling for every auth type in use
    - Covers client migration (Claude Desktop, Cursor, Claude Code)
    - Covers rollback strategy
    - Covers telemetry/observability
  risk_mitigation:
    weight: 0.15
    method: judge_rubric
    # "OAuth2 token refresh through proxy" was listed here and moved to
    # constraint_handling, so the constraint is not scored twice.
    criteria: 'Identifies risks: SSE connection lifecycle through the proxy, client config migration pain
      points, and how to roll back if the gateway fails during cutover.

      '
  grounding:
    weight: 0.15
    method: contains_check
    criteria:
    - 'wooj-brain'
    - '47219'
  constraint_handling:
    weight: 0.2
    method: judge_rubric
    criteria: 'Gmail cannot be migrated like the other four servers: its refresh tokens were issued to
      the desktop clients'' own OAuth client, and refreshing from any other client fails. A correct plan
      treats Gmail separately -- keeps it on a direct connection until the gateway holds credentials
      of its own (for example by registering the gateway as an OAuth client and re-consenting) --
      rather than proxying all five servers the same way.

      '
max_turns: 10
timeout_seconds: 900

# Global evaluation.max_tokens is 4096. Hard planning tasks exceed it: the
# pre-Wave-1 baseline and run-20260830-064654 both produced exactly 12834 chars
# for planning_finance_hard_01 and hit finish_reason=length, so every historical
# planning score was computed on truncated output.
max_tokens: 12288
