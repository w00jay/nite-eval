id: coding_wine_medium_01
dimension: coding
difficulty: medium
source_project: wine-tracker
description: 'Implement a Supabase Edge Function that receives a wine label image, calls Claude Vision
  to extract wine metadata, matches against the wine catalog, and returns structured results. Mirrors
  the scan-label flow.

  '
system_prompt: 'You are a TypeScript developer building Supabase Edge Functions.

  '
tools:
- type: function
  function:
    name: write_file
    description: Write content to a file
    parameters:
      type: object
      properties:
        path:
          type: string
        content:
          type: string
      required:
      - path
      - content
- type: function
  function:
    name: run_tests
    description: Run TypeScript tests
    parameters:
      type: object
      properties:
        directory:
          type: string
      required:
      - directory
- type: function
  function:
    name: read_file
    description: Read a file's contents
    parameters:
      type: object
      properties:
        path:
          type: string
      required:
      - path
- type: function
  function:
    name: run_code
    description: Run a shell command
    parameters:
      type: object
      properties:
        command:
          type: string
      required:
      - command
user_message: |-
  Write a Supabase Edge Function (TypeScript, Deno) for the scan-label endpoint. It should: (1) accept a base64 image in the request body, (2) upload the image to Supabase Storage, (3) call Claude Vision to extract: producer, wine_name, vintage, region, varietal, wine_type, (4) search the wines table for a match using trigram similarity on producer + wine_name, (5) return the matched wine or create a new entry if no match above 0.6 similarity. Handle errors gracefully — a failed Claude API call should return a partial result prompting manual entry, not a 500.
  
  Your code is imported and tested against this exact contract, so match it:
  
    File: scan_label.ts
  
    export interface WineData {
      producer: string | null;
      wine_name: string | null;
      vintage: number | null;
      region: string | null;
      varietal: string | null;
      wine_type: string | null;
    }
  
    export interface Wine extends WineData { id: string; }
  
    export interface Deps {
      uploadImage(bytes: Uint8Array, path: string): Promise<{ url: string }>;
      extractLabel(base64Image: string): Promise<WineData>;
      findSimilarWine(producer: string | null, wineName: string | null):
        Promise<{ wine: Wine; score: number } | null>;
      createWine(data: WineData, imageUrl: string | null): Promise<Wine>;
    }
  
    export const SIMILARITY_THRESHOLD = 0.6;
  
    export function createHandler(deps: Deps): (req: Request) => Promise<Response>;
  
  Handler behaviour, all responses JSON:
  
    Body is {"image": "<base64>"}.
    Missing/empty/non-string image, or invalid base64  -> 400
        {"error": "<user-facing message>"}
    extractLabel throws                                -> 200
        {"manual_entry_required": true, "error": "<message>"}   (never 500)
    findSimilarWine returns score >= SIMILARITY_THRESHOLD -> 200
        {"wine": <the matched Wine>, "matched": true, "score": <number>}
    no match, or score below the threshold             -> 200
        {"wine": <the created Wine>, "matched": false}
    uploadImage throws                                 -> continue anyway; storage
        is not fatal. Pass null as imageUrl to createWine.
  
  Dependencies are injected, so do not import the Supabase or Anthropic SDKs and
  do not make network calls — the environment has no network. Write your files
  under /app/scanlabel.

test_suite:
  language: typescript
  tests:
  - name: TestSuccessfulScan
    expected: Returns matched wine with extracted metadata
  - name: TestNewWineCreation
    expected: Creates new wine entry when no match above threshold
  - name: TestClaudeAPIFailure
    expected: Returns 200 with manual_entry_required flag, not 500
  - name: TestInvalidImage
    expected: Returns 400 with user-friendly error message
  - name: TestMissingFields
    expected: Handles partial extraction (e.g., no vintage visible)
scoring:
  test_pass_rate:
    weight: 0.4
    method: automated
  error_handling:
    weight: 0.25
    method: judge_rubric
    criteria: 'Graceful degradation on Claude API failure. User-friendly error messages. No unhandled
      promise rejections. Partial results on incomplete extraction.

      '
  code_quality:
    weight: 0.2
    method: judge_rubric
    criteria: 'TypeScript strict types. No ''any''. Proper Supabase client usage. Thin orchestration pattern
      (DB query → build context → API call → store).

      '
  edge_case_handling:
    weight: 0.15
    method: judge_rubric
    criteria: Handles missing vintage, ambiguous matches, storage upload failure
max_turns: 24
max_tool_calls: 40
timeout_seconds: 2400
mock_responses:
  write_file:
  - match:
      path_contains: any
    response:
      content:
        status: written
        bytes: 1024
  run_tests:
  - match:
      directory_contains: any
    error: >-
      Test execution is not available in this environment. Write the implementation and its tests; correctness is evaluated separately after the conversation ends. Do not retry this tool.
  run_code:
  - match:
      command_contains: any
    error: >-
      Shell execution is not available in this environment. Write the implementation and its tests; correctness is evaluated separately after the conversation ends. Do not retry this tool.
  read_file:
  - match:
      path_contains: any
    response:
      content:
        content: // file contents placeholder
        exists: true

# Coding tasks emit whole source files inside a JSON string in a tool call.
# The global 4096 budget truncated mid-string, which the runner used to accept
# as a final answer (see audit: 56% of coding responses leaked <tool_call>).
max_tokens: 16384

environment:
  image: nite-eval-deno:2.1
  workdir: /app/scanlabel
  setup_cmd: cp -a /skeleton/. /app/scanlabel/
  test_cmd: deno test --quiet --no-check=remote 2>&1
  language: typescript
  command_timeout: 180
