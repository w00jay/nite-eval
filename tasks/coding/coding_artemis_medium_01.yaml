id: coding_artemis_medium_01
dimension: coding
difficulty: medium
source_project: artemis-tracker
description: 'Write a Python backend proxy that queries the JPL Horizons API for Artemis II position vectors
  and caches results. Handles the text-inside-JSON parsing quirk of the Horizons API.

  '
system_prompt: 'You are a Python developer building scientific data APIs.

  '
tools:
- type: function
  function:
    name: write_file
    description: Write content to a file
    parameters:
      type: object
      properties:
        path:
          type: string
        content:
          type: string
      required:
      - path
      - content
- type: function
  function:
    name: run_tests
    description: Run pytest
    parameters:
      type: object
      properties:
        directory:
          type: string
        verbose:
          type: boolean
      required:
      - directory
- type: function
  function:
    name: run_code
    description: Run a shell command
    parameters:
      type: object
      properties:
        command:
          type: string
      required:
      - command
user_message: |-
  Write a Python module that: (1) queries JPL Horizons API for Artemis II (COMMAND='-1024') position vectors (EPHEM_TYPE='VECTORS', CENTER='500@399' for geocentric), (2) parses the text-inside-JSON response format (Horizons returns a JSON wrapper around plain-text ephemeris data with $$SOE/$$EOE delimiters), (3) extracts X, Y, Z position and VX, VY, VZ velocity for each time step, (4) implements a TTL-based cache (5 min for recent data, 1 hour for historical), (5) exposes a clean get_position(time) function. Use httpx for async HTTP. Include tests with a mock Horizons response.
  
  The Horizons response is JSON of the form {"result": "<text>"}. The text uses
  this exact layout — one epoch line followed by labelled vector lines, repeated
  per time step, between the $$SOE and $$EOE markers:
  
    $$SOE
    2460600.500000000 = A.D. 2024-Sep-15 00:00:00.0000 TDB
     X = 1.234567890123456E+05 Y =-2.345678901234567E+05 Z = 3.456789012345678E+04
     VX=-1.234567890123456E+00 VY= 2.345678901234567E+00 VZ= 3.456789012345678E-01
     LT= 1.234567890123456E+00 RG= 3.456789012345678E+05 RR= 1.234567890123456E-01
    2460601.500000000 = A.D. 2024-Sep-16 00:00:00.0000 TDB
     X = 2.234567890123456E+05 Y =-1.345678901234567E+05 Z = 4.456789012345678E+04
     VX=-2.234567890123456E+00 VY= 1.345678901234567E+00 VZ= 4.456789012345678E-01
     LT= 2.234567890123456E+00 RG= 4.456789012345678E+05 RR= 2.234567890123456E-01
    $$EOE
  
  Note the value signs may butt directly against the `=` with no space, and the
  LT/RG/RR line carries light-time, range and range-rate, which this module does
  not need.
  
  Your code is imported and tested against this exact contract, so match it:
  
    File: horizons_client.py
  
    def parse_vectors(text: str) -> list[dict]
        Parse the Horizons text block. Return one dict per time step, in file
        order, with float keys: jdtdb, x, y, z, vx, vy, vz. Only the rows between
        the $$SOE and $$EOE markers are data. Raise ValueError if the markers are
        missing or no rows parse.
  
    class HorizonsError(Exception)
        Raised for any upstream failure (non-2xx, malformed payload).
  
    class HorizonsClient:
        def __init__(self, client: httpx.AsyncClient, *,
                     ttl_recent: float = 300.0,
                     ttl_historical: float = 3600.0,
                     now: Callable[[], float] = time.monotonic) -> None
  
        async def get_position(self, jdtdb: float) -> dict
            Return {"x","y","z","vx","vy","vz"} floats for jdtdb. If jdtdb falls
            between two fetched steps, linearly interpolate. Cache the fetched
            ephemeris; a second call inside the TTL must not issue another HTTP
            request. Call `now()` for all time checks — never time.time() directly
            — so tests can control expiry.
  
        request_count: int
            Number of HTTP requests actually issued. Tests read this.
  
  The Horizons response is JSON of the form {"result": "<text>"} where the text
  contains the $$SOE/$$EOE block.
  
  httpx, pytest and pytest-asyncio are installed. The environment has no network:
  tests inject an httpx.AsyncClient built on httpx.MockTransport, so do not open
  your own client or call a live URL. Write your files under /app/artemis.

test_suite:
  language: python
  tests:
  - name: test_parse_horizons_response
    expected: Correctly extracts vectors from $$SOE/$$EOE delimited text
  - name: test_cache_hit
    expected: Returns cached data without HTTP call on second request
  - name: test_cache_ttl_expiry
    expected: Re-fetches after TTL expires
  - name: test_api_error_handling
    expected: Raises descriptive error on API failure
  - name: test_get_position_interpolation
    expected: Returns interpolated position for times between data points
scoring:
  test_pass_rate:
    weight: 0.4
    method: automated
  parsing_correctness:
    weight: 0.25
    method: automated
    criteria: Correctly handles $$SOE/$$EOE format, whitespace, multi-line records
  code_quality:
    weight: 0.2
    method: judge_rubric
    criteria: Type hints, async/await pattern, proper error types, docstrings
  cache_design:
    weight: 0.15
    method: judge_rubric
    criteria: TTL logic is correct, thread-safe, doesn't leak memory
max_turns: 24
max_tool_calls: 40
timeout_seconds: 2400
mock_responses:
  write_file:
  - match:
      path_contains: any
    response:
      content:
        status: written
        bytes: 1024
  run_tests:
  - match:
      directory_contains: any
    error: >-
      Test execution is not available in this environment. Write the implementation and its tests; correctness is evaluated separately after the conversation ends. Do not retry this tool.
  run_code:
  - match:
      command_contains: any
    error: >-
      Shell execution is not available in this environment. Write the implementation and its tests; correctness is evaluated separately after the conversation ends. Do not retry this tool.
  read_file:
  - match:
      path_contains: any
    response:
      content:
        content: // file contents placeholder
        exists: true

# Coding tasks emit whole source files inside a JSON string in a tool call.
# The global 4096 budget truncated mid-string, which the runner used to accept
# as a final answer (see audit: 56% of coding responses leaked <tool_call>).
# Raised again from 16384 after B1: against a real sandbox the model writes the
# implementation and its tests in one turn. coding_artemis_medium_01 emitted
# 24725 chars on turn 2 and hit the cap. Under the mocks it wrote less, because
# it was told its tests passed and stopped.
max_tokens: 24576

environment:
  image: nite-eval-python:3.12
  workdir: /app/artemis
  setup_cmd: cp -a /skeleton/. /app/artemis/
  # -p no:cacheprovider: the rootfs is read-only and pytest's cache writes warn.
  test_cmd: python -m pytest -q -p no:cacheprovider 2>&1
  # Scoring runs only our files; test_cmd stays broad so the model
  # still sees its own tests when it calls run_tests.
  hidden_test_cmd: python -m pytest test_hidden_horizons.py -q -p no:cacheprovider 2>&1
  # Model test files, moved aside before scoring so its helpers cannot
  # collide with the hidden suite's at compile time.
  isolate_globs: "test_*.py *_test.py"
  language: python
  command_timeout: 180
  checks:
    parsing_correctness: python -m pytest test_hidden_horizons.py -k parse -q -p no:cacheprovider
