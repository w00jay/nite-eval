id: coding_mcp_easy_01
dimension: coding
difficulty: easy
source_project: mcp-gateway
description: 'Implement a Go config loader that reads a servers.yaml file defining upstream MCP server
  connections with auth credentials.

  '
system_prompt: 'You are a Go developer building infrastructure tooling.

  '
tools:
- type: function
  function:
    name: write_file
    description: Write content to a file
    parameters:
      type: object
      properties:
        path:
          type: string
        content:
          type: string
      required:
      - path
      - content
- type: function
  function:
    name: run_tests
    description: Run Go tests in a directory
    parameters:
      type: object
      properties:
        directory:
          type: string
        verbose:
          type: boolean
      required:
      - directory
- type: function
  function:
    name: run_code
    description: Run a shell command
    parameters:
      type: object
      properties:
        command:
          type: string
      required:
      - command
user_message: |-
  Write a Go package that loads MCP server configuration from a YAML file. The config should support: server name, endpoint URL, transport type (sse or http), auth type (bearer, api_key, oauth2), auth credentials, and an enabled flag. Include validation (URL must be valid, transport and auth type must be recognized) and tests.
  
  Your code is compiled and tested against this exact contract, so match it:
  
    module mcpconfig            (go.mod, go 1.23)
    package config              (in config.go)
  
    type ServerConfig struct {
        Name      string  // yaml:"name"
        URL       string  // yaml:"url"
        Transport string  // yaml:"transport"
        AuthType  string  // yaml:"auth_type"
        AuthToken string  // yaml:"auth_token"
        APIKey    string  // yaml:"api_key"
        Enabled   bool    // yaml:"enabled"
    }
  
    type Config struct {
        Servers []ServerConfig  // yaml:"servers"
    }
  
    func Load(path string) (*Config, error)
    func (c *Config) EnabledServers() []ServerConfig
  
  Load reads and parses the file, validates every server, and returns an error if
  any is invalid or the file cannot be read or parsed. Use gopkg.in/yaml.v3, which
  is already vendored — do not run "go get" or "go mod tidy", the environment has
  no network. Write your files under /app/mcpconfig.
test_suite:
  language: go
  tests:
  - name: TestLoadValidConfig
    input_file: "servers:\n  - name: notion\n    url: https://mcp.notion.com/mcp\n    transport: sse\n\
      \    auth_type: bearer\n    auth_token: \"ntn_test123\"\n    enabled: true\n  - name: wooj-brain\n\
      \    url: https://example.supabase.co/functions/v1/mcp\n    transport: http\n    auth_type: api_key\n\
      \    api_key: \"sk_test456\"\n    enabled: true\n"
    expected: loads 2 servers, both enabled, correct auth types
  - name: TestInvalidURL
    input_file: "servers:\n  - name: bad\n    url: \"not-a-url\"\n    transport: sse\n    auth_type: bearer\n"
    expected: returns validation error
  - name: TestUnknownAuthType
    input_file: "servers:\n  - name: bad\n    url: https://example.com\n    transport: sse\n    auth_type:\
      \ \"magic\"\n"
    expected: returns validation error for auth_type
  - name: TestFilterEnabled
    input_file: "servers:\n  - name: active\n    url: https://a.com\n    transport: sse\n    auth_type:\
      \ bearer\n    enabled: true\n  - name: disabled\n    url: https://b.com\n    transport: sse\n  \
      \  auth_type: bearer\n    enabled: false\n"
    expected: EnabledServers() returns only 1 server
scoring:
  test_pass_rate:
    weight: 0.5
    method: automated
    criteria: pass@1 on test suite
  code_quality:
    weight: 0.3
    method: judge_rubric
    criteria: 'Idiomatic Go: exported types with documentation, proper error wrapping, yaml struct tags,
      no panics in library code.

      '
  go_vet_clean:
    weight: 0.2
    method: automated
    criteria: go vet passes with no issues
max_turns: 16
max_tool_calls: 30
timeout_seconds: 1200

# Coding tasks emit whole source files inside a JSON string in a tool call.
# The global 4096 budget truncated mid-string, which the runner used to accept
# as a final answer (see audit: 56% of coding responses leaked <tool_call>).
# Raised again from 16384 after B1: against a real sandbox the model writes the
# implementation and its tests in one turn. coding_artemis_medium_01 emitted
# 24725 chars on turn 2 and hit the cap. Under the mocks it wrote less, because
# it was told its tests passed and stopped.
# Raised again from 24576 on 2026-08-31. ornith-1.5 truncated all four coding
# tasks at 24576, emitting 89k-115k chars of genuine work each time — not the
# malformed output the parser used to see, which is gone since it moved to
# native tool calling. The budget is now the only thing failing these tasks.
# 32768 is half the 65536 context, leaving the other half for prompt and
# compacted history; going higher risks context exhaustion instead.
#
# This changes the task for every model, so coding scores before this date are
# not comparable to ones after. Five of six models in run-20260830-231628 also
# truncated on coding_artemis_medium_01, so the fleet needs re-running.
max_tokens: 32768

environment:
  image: nite-eval-go:1.23
  workdir: /app/mcpconfig
  # The workdir is a tmpfs at run time and shadows the image's contents, so the
  # vendored module skeleton is copied in once the mount exists.
  setup_cmd: cp -a /skeleton/. /app/mcpconfig/ && sed -i 's|^module .*|module mcpconfig|' /app/mcpconfig/go.mod
  test_cmd: go test ./... -v 2>&1
  # Scoring runs only our files; test_cmd stays broad so the model
  # still sees its own tests when it calls run_tests.
  hidden_test_cmd: go test -run '^TestHidden' . -v 2>&1
  # Model test files, moved aside before scoring so its helpers cannot
  # collide with the hidden suite's at compile time.
  isolate_globs: "*_test.go"
  language: go
  checks:
    go_vet_clean: go vet .
