# nite-eval master configuration

target:
  base_url: "http://127.0.0.1:9070"
  llama_swap_config: "config/llama_swap_config.yaml"

judge:
  base_url: "http://127.0.0.1:9091/v1"  # fallback if per-judge URLs not set
  flow_judge_model: "flow-judge"
  flow_judge_url: "http://127.0.0.1:9092/v1"
  reward_anything_model: "reward-anything"
  reward_anything_url: "http://127.0.0.1:9091/v1"
  temperature: 0.1
  max_tokens: 2048

models:
  - name: "gemma4-26b-a4b"
    backend: "llama.cpp"
  - name: "qwen3.6-35b-a3b"
    backend: "llama.cpp"
    # Qwen3-family chat-template trigger that disables <think> output.
    # Without this, qwen3.6 burns the entire max_tokens budget on
    # reasoning and never emits a final answer on coding tasks.
    system_suffix: "/no_think"
  - name: "qwen3.8-27b"
    backend: "llama.cpp"
    chat_template_kwargs:
      reasoning_effort: "medium"
    # NOT system_suffix: "/no_think" — that string does not appear anywhere in
    # Qwen3.8's chat template (verified against the GGUF's embedded template),
    # so it is inert filler text. The template defaults to
    # `reasoning_effort|default('xhigh')` and injects "Reasoning effort is set
    # to xhigh. Please think carefully..." into the system prompt, so the model
    # is actively told to maximize reasoning.
    #
    # Measured on the live server, "What is 17*23?" at temp=0:
    #   baseline                     -> 67 completion tokens, reasoning_len 125
    #   system_suffix "/no_think"    -> 36 completion tokens, reasoning_len  89
    #   reasoning_effort: "low"      -> 62 completion tokens, reasoning_len 110
    #   enable_thinking: false       ->  4 completion tokens, reasoning_len   0
    # Only enable_thinking actually closes the <think> block (template emits a
    # pre-closed `<think>\n\n</think>` when it is false).
    #
    # But fully disabling thinking costs quality: run-20260829-051125
    # (enable_thinking: false) dropped the composite to 0.62 from 0.68/0.66,
    # with research falling 0.80 -> 0.63 (research_wine_medium_01 went
    # 1.00/1.00 -> 0.65). It was 36% faster with zero empty-content warnings,
    # but that is not worth the accuracy. The real problem is the xhigh
    # DEFAULT overrunning max_tokens, not reasoning as such — hence "medium".
    #
    # Symptom without it: run-20260829-040649 and -044155 both returned
    # finish_reason=length with EMPTY content and 11k-16k chars of
    # `reasoning_content` on all 4 coding tasks — the entire max_tokens budget
    # spent thinking, no answer. The reasoning_content fallback then feeds raw
    # chain-of-thought to the judge, pinning coding at 0.15-0.42.
    #
    # Requires llama.cpp >= cd26896c1 (2026-08-20). Build 8642 (2026-04-03) and
    # earlier abort with:
    #   error loading model: missing tensor 'blk.64.ssm_conv1d.weight'
    # Qwen3.8 is hybrid attention+SSM: 336 SSM tensors across 48 of 65 blocks
    # (every block where b % 4 != 3), but the final block 64 is attention-only.
    # Older builds apply the modulo rule to block 64 and expect SSM tensors.

  - name: "ornith-1.5-35b-a3b"
    backend: "llama.cpp"
    # Ornith only. Its documented usage passes `tools` in the request and reads
    # structured message.tool_calls; llama-server renders the model's own
    # template and parses the call back. Probed on the live model: 5/5 clean
    # calls, correct types (limit arrived as int), zero repairs.
    #
    # The harness default — tool definitions pasted into the system prompt, the
    # reply parsed out of text — asks this model to hand-write JSON in prose,
    # and it improvised a different malformation nearly every turn: dropped
    # name-value quotes, `<function":` for `{"function":`, unclosed <tool_call>
    # batches, JSON opened and closed in XML, closing tags used as openers.
    # Three runs of repairs took it 8/15 -> 10/15 -> 12/15 and still needed 52
    # repairs across 26 calls on coding_wine_medium_01 alone.
    #
    # Deliberately not switched on for the other six: it changes what a model is
    # asked to do, so their scores would move and stop being comparable to the
    # existing baseline. Ornith has no baseline to protect.
    native_tools: true
    # Thinking off. Measured both ways on the native path, 15 tasks each
    # (run-20260831-192329 on, run-20260831-202252 off):
    #
    #   dimension   on     off    delta
    #   research    0.80   0.81   +0.01
    #   planning    0.80   0.79   -0.01
    #   coding      0.22   0.49   +0.27
    #   agentic     0.80   0.72   -0.08
    #   composite   0.65   0.70   +0.05
    #
    # Coding more than doubles because all four tasks finish instead of one.
    # With thinking on, coding_artemis_medium_01 spent the entire 32768-token
    # budget on turn 1 without a single tool call, emitting 121k chars of
    # deliberation — "Let me" 212x, "But" 151x, "Hmm" 72x against 28 def/class
    # lines — and stopped mid-sentence on "I think I'm way overthinking this".
    #
    # Kept on until 2026-08-31 because enable_thinking: false wrecked
    # hand-written tool-call JSON (1/8 parseable against 8/8). That reason went
    # away with native_tools: the server's template and grammar produce the
    # call, so the model formats nothing.
    #
    # Not the same finding as qwen3.8, which keeps reasoning_effort: medium
    # because thinking off cost it research 0.80 -> 0.63. Ornith's research did
    # not move. The two models react differently to the same switch; do not
    # generalise either result to the other.
    #
    # The cost is real but smaller than the gain and concentrated in one task:
    # agentic_mcp_hard_01 falls 0.89 -> 0.63 and accounts for most of the
    # agentic loss. +0.05 composite also sits exactly on
    # scoring.min_detectable_difference, so the composite alone does not carry
    # this — 15/15 tasks against 12/15 does, as does latency
    # (planning_mcp_medium_01 31.4s -> 6.4s).
    chat_template_kwargs:
      enable_thinking: false
    # Thinking stays ON, deliberately, unlike every other reasoning model here.
    #
    # Its template's only reasoning switch is `enable_thinking` (there is no
    # /no_think branch and no reasoning_effort), and turning it off wrecks the
    # tool-call JSON. Measured on the live model, 8 prompts at temperature 0,
    # counting how many tool calls the parser can read:
    #
    #   thinking ON   -> 4/8 valid Hermes, 4/8 dropped name-value quote
    #                    = 8/8 usable once _repair_dropped_name_value_quote runs
    #   thinking OFF  -> 1/8 valid, and the rest fragment into five shapes:
    #                    {"search_thoughts", "parameters": {...}}
    #                    {"search_thoughts", "limit": 10, "query": "..."}}
    #                    {"capture_thought", "content": ..., "type": ...}
    #                    {"search_thoughts", "params": {...}}
    #                    plus the dropped-quote form
    #                    = 1/8 usable, and the rest are not safely repairable
    #                      because the arguments key is missing or renamed.
    #
    # So the budget risk of leaving thinking on is the lesser problem: a
    # truncated answer still scores, a dropped tool call ends the turn with no
    # tools at all. Watch max_tokens on coding tasks instead.
    #
    # Its template does hardcode an XML tool-call format
    # (<function=NAME><parameter=KEY>...), and the parser handles that, but the
    # model never emitted it in 16 samples — that branch only renders when
    # tool definitions are passed to the template, and nite-eval injects them
    # as prompt text instead.

  - name: "lfm2.5-2.6b"
    backend: "llama.cpp"
    native_tools: true
    # arch `lfm2`: 22 conv layers, 8 attention. Its generation prompt opens
    # `<think>` unconditionally and the template has no switch to close it, so
    # unlike ornith there is no thinking decision to make — only a budget to
    # watch. Probed on the live model: 3/3 clean structured calls, reasoning
    # correctly separated into reasoning_content with empty content.
    #
    # `preserve_thinking` exists in the template but controls whether *prior*
    # thinking blocks stay in history, not whether the model thinks. Its
    # default of false is what we want.

  - name: "lfm2.5-8b-a1b"
    backend: "llama.cpp"
    native_tools: true
    # arch `lfm2moe`: 32 experts with 4 active, 18 conv layers and 6 attention.
    # Its generation prompt does NOT open `<think>`, unlike the 2.6B, so
    # reasoning is the model's choice. It reasons anyway — 318-510 chars of
    # reasoning_content on short prompts — and shows better judgment about when
    # a tool is needed: asked for 17*23 it answered 391 directly where the 2.6B
    # reached for run_code.

  - name: "muse-glimmer-30b"
    backend: "llama.cpp"
    native_tools: true
    # arch `muse-glimmer`: 52 layers, 39 sliding-attention and 13 full, vocab
    # 202048. 16400 MiB at ctx 65536. Probed on the live model: 2/2 clean
    # structured calls, and it answers 17*23 directly rather than reaching for
    # a tool.
    #
    # native_tools is not optional here. Its template emits a wholly custom
    # format that hermes_parser cannot read at all:
    #   <atem:function_calls><atem:invoke name="F"><atem:parameter name="p">
    # and it raises a template exception if tool_call.function.arguments is not
    # a dict. On the prompt-text path it would score zero on every tool task.
    #
    # `reasoning_strength` is left at its template default of 'high'
    # deliberately, not by omission. Measured on short prompts, the knob barely
    # touches tool calls (114/87 chars of reasoning at every setting) and only
    # moves the reasoning-heavy case: 624 chars at high, 508 at medium, 192 at
    # low. That is not enough to justify picking one blind.
    #
    # The risk to watch is coding. qwen3.8's template defaults to xhigh and
    # exhausted its whole max_tokens inside reasoning before emitting an
    # answer, which is why it carries reasoning_effort: medium; ornith with
    # thinking on did the same. If Muse-Glimmer truncates coding tasks, try
    # reasoning_strength: medium before raising max_tokens — with ornith,
    # raising the budget only bought more deliberation.

evaluation:
  temperature: 0.0
  max_tokens: 4096
  # Average 3 judge samples per criterion. The target model is essentially
  # deterministic at temperature 0 (coding_artemis_medium_01 reproduced across
  # three runs at 600163 / 599702 / 601768 ms with identical scores), so
  # run-to-run variance comes from the judge. Averaging attacks the actual
  # source; repeat target runs would buy nothing. Costs 3x judge calls.
  judge_averaging: true
  warm_up: true  # Send a warm-up prompt after each model swap

scoring:
  # Composite gaps below this are inside judge variance and are reported as
  # ties. 15 tasks at one sample each does not resolve finer than this; raising
  # the task count or the judge sample count is what would lower it.
  min_detectable_difference: 0.05
  # Some dimensions are noisier than the composite and must not be read against
  # its threshold. Coding tasks run in a real container and the container's
  # output enters the conversation: an `ls -la` on turn 1 returns the directory
  # mtime, which is the container's creation time, so two runs of the same model
  # at temperature 0 diverge from turn 2 and go on to write different code.
  # ornith-1.5 emitted 65986 / 66666 / 65604 bytes of tool-call arguments across
  # three runs of coding_artemis_medium_01, and in one of them the code it
  # happened to write hit a real bug: both automated criteria scored 0 rather
  # than 1.00 and 0.93, moving the task 0.62 -> 0.00.
  #
  # Observed per-task swings on identical configuration were 0.1-0.6, and the
  # coding dimension moved 0.49 -> 0.39 between two such runs. 0.15 is set from
  # that dimension-level spread, not from the per-task extremes.
  #
  # Accepted rather than fixed. Making the container reproducible means pinning
  # its clock and every other varying surface; normalising timestamps in sandbox
  # output is on the TODO as the cheaper partial fix. Until then the honest
  # response is to stop over-reading coding gaps.
  dimension_min_detectable_difference:
    coding: 0.15
  dimension_weights:
    research: 0.25
    planning: 0.25
    coding: 0.25
    agentic: 0.25

results:
  dir: "results/runs"
  db_name: "eval_results.db"

hardware:
  # DOCUMENTATION ONLY — no code reads this block. The values that actually
  # take effect are TARGET_GPU_UUID / JUDGE_GPU_UUID in .env, consumed by
  # scripts/run_nightly.sh, plus the per-model CUDA_VISIBLE_DEVICES pinned
  # in config/llama_swap_config.yaml. Override at runtime with
  # NITE_TARGET_GPU / NITE_JUDGE_GPU.
  target_gpu: 1  # RTX 3090 24GB — model under evaluation
  judge_gpu: 0   # RTX 3060 12GB — both judge servers
  # Tesla P40 (index 2) is intentionally unused during evals.
