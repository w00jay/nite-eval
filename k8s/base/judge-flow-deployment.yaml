apiVersion: apps/v1
kind: Deployment
metadata:
  name: judge-flow
  namespace: nite-eval
  labels:
    app.kubernetes.io/name: judge-flow
    app.kubernetes.io/part-of: nite-eval
    app.kubernetes.io/component: judge
spec:
  replicas: 1
  strategy:
    type: Recreate  # GPU resource is exclusive; no rolling update
  selector:
    matchLabels:
      app.kubernetes.io/name: judge-flow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: judge-flow
        app.kubernetes.io/part-of: nite-eval
        app.kubernetes.io/component: judge
    spec:
      runtimeClassName: nvidia
      terminationGracePeriodSeconds: 60
      containers:
        - name: llama-server
          image: ghcr.io/w00jay/nite-eval-judge:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9092
          env:
            - name: PORT
              value: "9092"
            - name: JUDGE_MODEL_PATH
              value: "/judge-models/Flow-Judge-v0.1.Q6_K.gguf"
            - name: NGL
              value: "999"
            - name: CTX_SIZE
              value: "4096"
            - name: NPARALLEL
              value: "1"
            - name: EXTRA_FLAGS
              value: "-fa on"
            - name: NVIDIA_VISIBLE_DEVICES
              valueFrom:
                secretKeyRef:
                  name: nite-eval-gpu-pinning
                  key: JUDGE_GPU_UUID
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "compute,utility"
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              cpu: "4"
              memory: 12Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 9092
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: judge-models
              mountPath: /judge-models
              readOnly: true
      volumes:
        - name: judge-models
          hostPath:
            # Host directory containing both judge GGUFs.
            # Override per-cluster via kustomize patch if it differs.
            path: /home/woojay/models
            type: Directory
